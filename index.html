<title>疯狂占有</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23ffffff'/%3E%3Cpath d='M12 3C8 7 6 10 6 12.5A6 6 0 0 0 12 18.5 6 6 0 0 0 18 12.5C18 10 16 7 12 3z' fill='%23c8102e'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --red:#c8102e;
    --red-bright:#d43a55;
    --red-deep:#8f0a20;
    --red-soft:rgba(200,16,46,.12);
    --ink:#3a1420;
    --gray:#8a8a8a;
    --blue:#5b8cff;
  }
  html,body{height:100%;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:"思源宋体","Source Han Serif SC","Source Han Serif CN","Noto Serif CJK SC","Songti SC","SimSun","宋体",serif;
    font-weight:200;
    overflow:hidden;overscroll-behavior:none;
  }

  /* 雪（红） */
  #snow{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
  .flake{position:absolute;top:-24px;border-radius:50%;will-change:transform,opacity;animation:fall linear infinite;}
  @keyframes fall{
    0%{transform:translate3d(0,0,0) scale(1);opacity:0;}
    6%{opacity:.55;}
    50%{transform:translate3d(var(--sway),52vh,0) scale(.94);opacity:.45;}
    94%{opacity:.5;}
    100%{transform:translate3d(calc(var(--sway)*1.4),106vh,0) scale(.9);opacity:0;}
  }

  /* 水滴带走 */
  #drops{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden;}
  .drop{position:absolute;width:12px;height:16px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    background:radial-gradient(circle at 38% 30%,#ff8a92,var(--red) 70%);
    box-shadow:0 0 6px rgba(200,16,46,.5);
    will-change:transform,opacity;animation:dropfly .72s cubic-bezier(.2,.7,.4,1) forwards;}
  @keyframes dropfly{0%{transform:translate(0,0) scale(1);opacity:.95;}
    100%{transform:translate(var(--dx),var(--dy)) scale(.18);opacity:0;}}
  .pulseDrop{position:absolute;width:11px;height:15px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    background:radial-gradient(circle at 38% 30%,#ffb3ba,#e0304c 70%);
    box-shadow:0 0 8px rgba(200,16,46,.7);
    will-change:transform,opacity;animation:pulseD 1.1s ease-out infinite;}
  @keyframes pulseD{0%{transform:scale(.4);opacity:.9;}70%{transform:scale(1.7);opacity:.25;}
    100%{transform:scale(.4);opacity:0;}}

  /* 点击光圈晕开 */
  .ripple{position:fixed;z-index:16;width:26px;height:26px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(200,60,80,.55);
    box-shadow:0 0 10px rgba(200,16,46,.3), inset 0 0 8px rgba(200,60,80,.2);
    transform:translate(-50%,-50%) scale(.2);
    will-change:transform,opacity;animation:ripple .55s ease-out forwards;}
  .ripple.core{width:18px;height:18px;border-width:4px;box-shadow:none;animation:rippleCore .55s ease-out forwards;}
  @keyframes ripple{0%{transform:translate(-50%,-50%) scale(.25);opacity:.85;}
    100%{transform:translate(-50%,-50%) scale(5.5);opacity:0;}}
  @keyframes rippleCore{0%{transform:translate(-50%,-50%) scale(.4);opacity:.7;}
    100%{transform:translate(-50%,-50%) scale(2.2);opacity:0;}}

  /* 预警红脉冲 */
  #warning{position:fixed;inset:0;z-index:13;pointer-events:none;display:none;align-items:center;justify-content:center;}
  #warning.show{display:flex;}
  #warning::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center,rgba(200,16,46,.10),transparent 62%);
    animation:warnPulse .55s ease-in-out infinite;}
  @keyframes warnPulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* 页面 */
  .page{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;
    justify-content:center;padding:5vh 6vw 13vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    text-align:center;}
  .page.active{display:flex;animation:pageIn .6s ease;}
  @keyframes pageIn{from{opacity:0;transform:scale(.99);}to{opacity:1;transform:none;}}

  .deco{position:absolute;opacity:.25;pointer-events:none;user-select:none;}
  .deco.float{animation:drift 7s ease-in-out infinite;}
  .deco.float2{animation:drift2 9s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}
  @keyframes drift2{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}

  /* 开场 */
  #splash{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 95% at 50% 38%,#ffffff,#fff7f8 72%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8vw;text-align:center;}
  #splash .knot{color:var(--red);font-weight:300;line-height:1.8;font-size:clamp(18px,5.4vw,30px);
    letter-spacing:.12em;text-shadow:0 0 18px rgba(200,16,46,.25);opacity:0;animation:knotIn 2.4s ease forwards;}
  @keyframes knotIn{0%{opacity:0;letter-spacing:.5em;}60%{opacity:1;}100%{opacity:1;letter-spacing:.16em;}}
  #splash .enter{margin-top:9vh;color:var(--gray);font-size:clamp(14px,3.6vw,17px);letter-spacing:.3em;
    opacity:0;animation:enterBlink 1.4s ease 2.4s infinite;}
  @keyframes enterBlink{0%,100%{opacity:0;}50%{opacity:1;}}
  #splash .btl{margin-top:16px;width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);
    opacity:0;animation:knotIn 1s ease 1.2s forwards;}

  /* 键 */
  .key{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;margin:10px;
    border:1.5px solid var(--red);border-radius:40px;color:var(--red);background:#ffffff;
    font-size:clamp(15px,4vw,18px);letter-spacing:.2em;cursor:pointer;text-decoration:none;
    transition:transform .2s,box-shadow .25s,background .25s,color .25s;user-select:none;}
  .key:active{transform:scale(.96);}
  .key:hover{background:var(--red-soft);}

  /* 愿意键轻轻晃动 */
  #page1 #btnYes.sway{animation:swayGentle 1.6s ease-in-out infinite;
    box-shadow:0 0 0 0 rgba(200,16,46,.4), 0 0 20px rgba(200,16,46,.25);}
  @keyframes swayGentle{0%,100%{transform:rotate(0);}
    25%{transform:rotate(-2.5deg);}50%{transform:rotate(2deg);}75%{transform:rotate(-2deg);}}

  /* 页1 */
  #page1 .panel{width:min(92%,600px);padding:30px 22px 34px;border:1.5px solid var(--red);border-radius:14px;
    background:#ffffff;box-shadow:0 6px 30px var(--red-soft);}
  #page1 .q{color:var(--red);font-size:clamp(20px,6.2vw,36px);font-weight:300;letter-spacing:.14em;
    text-shadow:0 0 18px rgba(200,16,46,.25);}
  #page1 .sub{color:var(--gray);font-size:clamp(12px,3.2vw,14px);margin-top:14px;letter-spacing:.24em;}
  #page1 .btns{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
  #page1 .floatline{position:fixed;z-index:11;white-space:nowrap;color:var(--red);
    font-size:clamp(15px,4.4vw,21px);font-weight:300;letter-spacing:.1em;text-shadow:0 0 10px rgba(200,16,46,.3);
    transform:translate(-50%,-50%);animation:floatAcross var(--d,6.5s) ease-in-out forwards;pointer-events:none;}
  @keyframes floatAcross{
    0%{transform:translate(-50%,-50%) translate(0,0);opacity:0;}
    10%{opacity:.9;}
    82%{opacity:.9;}
    100%{transform:translate(-50%,-50%) translate(var(--tx),var(--ty));opacity:0;}
  }

  #page2{justify-content:flex-start;padding-top:8vh;}
  #page2 .avatar{margin-bottom:16px;width:88px;height:88px;border-radius:50%;object-fit:cover;
    border:1.5px solid var(--red-soft);box-shadow:0 8px 20px rgba(200,16,46,.18);}
  #page2 .handle{color:var(--red);font-weight:300;font-size:clamp(22px,6.5vw,32px);letter-spacing:.06em;}
  #page2 .acc{color:var(--gray);font-size:clamp(12px,3.4vw,14px);letter-spacing:.12em;margin-top:6px;}
  #page2 .info{margin-top:14px;display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;
    color:var(--ink);font-size:clamp(13px,3.8vw,15px);}
  #page2 .info span{border-bottom:1.5px solid var(--red-soft);padding-bottom:2px;}
  #page2 .motto{margin-top:20px;color:var(--red-deep);font-size:clamp(16px,4.6vw,21px);font-weight:300;
    letter-spacing:.1em;}
  #page2 .tags{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  #page2 .tag{border:1.5px solid var(--red);color:var(--red);border-radius:30px;padding:5px 18px;
    font-size:clamp(13px,3.8vw,15px);letter-spacing:.16em;background:#ffffff;}
  #page2 .mod{margin-top:26px;}
  #page2 .mod h3{color:var(--red);font-size:clamp(15px,4.4vw,18px);letter-spacing:.16em;font-weight:300;}
  #page2 .slogan{margin-top:12px;color:var(--ink);font-size:clamp(14px,4.2vw,18px);letter-spacing:.08em;line-height:1.9;}
  #page2 .slogan b{display:block;color:var(--red);font-weight:400;}
  #page2 .style{margin-top:22px;}
  #page2 .style h4{color:var(--red-deep);font-size:clamp(13px,3.8vw,15px);letter-spacing:.2em;margin-bottom:12px;}
  #page2 .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  #page2 .chip{border:1px solid var(--red);color:var(--ink);border-radius:20px;padding:4px 12px;
    font-size:clamp(12px,3.4vw,14px);background:#ffffff;letter-spacing:.05em;}
  #page2 .hint{margin-top:16px;color:var(--gray);font-size:clamp(11px,3vw,13px);letter-spacing:.24em;}

  /* 页3 */
  #page3 .curse{position:relative;max-width:680px;color:var(--red-deep);font-size:clamp(16px,4.8vw,21px);
    line-height:2;font-weight:300;letter-spacing:.06em;}
  #page3 .links{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  #page3 .links a{width:min(84%,360px);}

  /* 页4 */
  #page4{justify-content:center;}
  #page4 .catWrap{position:relative;margin-bottom:6vh;opacity:0;animation:catIn 1.4s ease forwards;animation-delay:.7s;line-height:0;}
  #page4 .catWrap img{display:block;width:min(42vw,238px);height:auto;filter:drop-shadow(0 8px 20px rgba(200,16,46,.30));}
  @keyframes catIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  #p4text{color:var(--red);font-size:clamp(24px,7.5vw,44px);font-weight:300;letter-spacing:.14em;
    min-height:1.4em;display:flex;flex-wrap:wrap;justify-content:center;line-height:1.6;max-width:90%;
    text-shadow:0 0 20px rgba(200,16,46,.2);}
  #p4text span{display:inline-block;opacity:0;transform:translateY(10px);}
  #p4text span.in{animation:charIn .42s ease forwards;}
  @keyframes charIn{to{opacity:1;transform:translateY(0);}}
  #p4text.shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}80%{transform:translateX(5px);}}
  #p4text.fadeout{animation:fadeOut 1.1s ease forwards;}
  @keyframes fadeOut{to{opacity:0;transform:scale(.94);}}
  #endmark{color:var(--red);font-size:clamp(30px,10vw,60px);letter-spacing:.4em;font-weight:300;
    opacity:0;margin-top:5vh;}
  #endmark.show{animation:endIn 1.2s ease forwards;}
  @keyframes endIn{0%{opacity:0;letter-spacing:.8em;transform:scale(.9);}60%{opacity:1;}
    100%{opacity:1;letter-spacing:.5em;transform:scale(1);}}
  #page4 .subend{margin-top:4vh;color:var(--gray);font-size:clamp(12px,3.2vw,14px);letter-spacing:.22em;opacity:0;}
  #page4 .subend.show{opacity:1;transition:opacity 1.5s;}

  /* 音乐 */
  #musicBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;width:46px;height:46px;
    border-radius:50%;background:var(--red);color:#ffffff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(200,16,46,.45);cursor:pointer;border:none;animation:musicPulse 2s ease-in-out infinite;}
  #musicBtn:active{transform:scale(.9);}
  #musicBtn svg{pointer-events:none;}
  #icoOff{display:none;}
  @keyframes musicPulse{0%,100%{box-shadow:0 4px 14px rgba(200,16,46,.45);}
    50%{box-shadow:0 4px 24px rgba(200,16,46,.8);}}
  #playerBox{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:14;
    width:236px;height:66px;border-radius:10px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.18);
    border:1px solid var(--red-soft);transform:translateY(130%);transition:transform .35s ease;}
  #playerBox.open{transform:translateY(0);}
  #playerBox iframe{width:100%;height:100%;border:0;}
  /* 仅保留背景音乐：隐藏播放器外壳与音乐图标 */
  #playerBox{opacity:0;pointer-events:none;}
  #musicBtn{display:none;}

  @media (max-width:420px){
    #playerBox{width:200px;}
    .key{min-height:50px;}
    #page1 .panel{padding:24px 16px 28px;}
  }
</style>
</head>

<!-- 音乐 -->
<button id="musicBtn" aria-label="音乐">
  <svg id="icoOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <svg id="icoOff" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</button>
<div id="playerBox" class="open">
  <audio id="bgmAudio" src="https://raw.githubusercontent.com/qiluoyan/-2.0/main/bgm.mp3"
    preload="auto" loop title="背景音乐"></audio>
</div>

<script>
(function(){
  "use strict";
  var AC=null;
  function ac(){
    try{
      if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}
      if(AC.state==="suspended"){AC.resume();}
      return AC;
    }catch(e){return null;}
  }
  function sndBlip(freq,dur,vol){
    var c=ac();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type="sine";o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(dur||0.14));
  }
  function sndClick(){sndBlip(880,0.09,0.10);}
  function sndDrop(){
    var c=ac();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type="sine";
    o.frequency.setValueAtTime(1250,t);
    o.frequency.exponentialRampToValueAtTime(320,t+0.13);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.15,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.22);
  }
  function sndChar(){sndBlip(600+Math.random()*220,0.06,0.06);}
  function sndEnd(){
    var c=ac();if(!c)return;
    [520,660,780].forEach(function(f){
      var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.08,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.8);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.85);
    });
  }

  /* 雪 */
  var snow=document.getElementById("snow");
  var FLAKE_COUNT=28;
  for(var i=0;i<FLAKE_COUNT;i++){
    var f=document.createElement("span");
    f.className="flake";
    var s=Math.random()*5+2;
    f.style.cssText="left:"+(Math.random()*100)+"vw;width:"+s+"px;height:"+s+"px;"+
      "background:"+(Math.random()<0.5?"rgba(200,16,46,.45)":"rgba(200,16,46,.22)")+";"+
      "filter:blur("+(Math.random()*1+0.4)+"px);"+
      "animation-duration:"+(Math.random()*6+7)+"s;"+
      "animation-delay:-"+(Math.random()*14)+"s;"+
      "--sway:"+((Math.random()*120-60))+"px;";
    snow.appendChild(f);
  }

  /* 水滴带走 */
  var dropsEl=document.getElementById("drops");
  function burstDrops(x,y,n){
    n=n||14;
    var c=ac();if(c)c.resume();
    for(var i=0;i<n;i++){
      var d=document.createElement("span");
      d.className="drop";
      var ang=Math.random()*Math.PI*2;
      var dist=Math.random()*130+50;
      d.style.cssText="left:"+x+"px;top:"+y+"px;--dx:"+(Math.cos(ang)*dist)+"px;--dy:"+(Math.sin(ang)*dist-40)+"px;";
      dropsEl.appendChild(d);
      (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},760);})(d);
    }
  }
  function ringDrops(x,y){
    var c=ac();if(c)c.resume();
    for(var i=0;i<10;i++){
      var d=document.createElement("span");
      d.className="pulseDrop";
      var ang=(i/10)*Math.PI*2;
      var r=90;
      d.style.cssText="left:"+(x+Math.cos(ang)*r-6)+"px;top:"+(y+Math.sin(ang)*r-8)+"px;"+
        "animation-delay:"+(i*0.06)+"s;";
      dropsEl.appendChild(d);
      (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1300);})(d);
    }
  }

  /* 点击光圈晕开 */
  function spawnRipple(x,y){
    var r=document.createElement("span");
    r.className="ripple";
    r.style.left=x+"px";r.style.top=y+"px";
    dropsEl.appendChild(r);
    var c=document.createElement("span");
    c.className="ripple core";
    c.style.left=x+"px";c.style.top=y+"px";
    dropsEl.appendChild(c);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},600);})(r);
    (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},600);})(c);
  }
  document.addEventListener("click",function(e){
    spawnRipple(e.clientX,e.clientY);
  });

  /* 页面切换 */
  var pages=[document.getElementById("page1"),document.getElementById("page2"),
             document.getElementById("page3"),document.getElementById("page4")];
  var cur=0;
  function goTo(idx,x,y){
    if(idx<0||idx>3||idx===cur)return;
    var sx=x||window.innerWidth/2, sy=y||window.innerHeight/2;
    burstDrops(sx,sy,16);
    sndDrop();
    pages[cur].classList.remove("active");
    pages[cur].style.display="none";
    cur=idx;
    var p=pages[cur];
    p.style.display="flex";
    p.classList.remove("active");
    void p.offsetWidth;
    p.classList.add("active");
    if(cur===3){runPage4();}
  }

  /* 开场 */
  var splash=document.getElementById("splash");
  function reloadMusic(){
    var a=document.getElementById("bgmAudio");
    if(!a)return;
    a.volume=1;
    function tryPlay(){
      var p=a.play();
      if(p&&p.catch)p.catch(function(){});
    }
    tryPlay();
    /* iOS：若音频尚未加载就绪，play() 会被系统拒绝，等就绪后补播 */
    if(a.readyState<3){
      var once=function(){tryPlay();};
      a.addEventListener("loadeddata",once,{once:true});
      a.addEventListener("canplay",once,{once:true});
      setTimeout(tryPlay,1500);
      setTimeout(tryPlay,3000);
    }
  }
  function dismissSplash(){
    ac();if(AC&&AC.state==="suspended")AC.resume();
    reloadMusic(); /* 手势内重载播放器触发自动播放 */
    splash.style.transition="opacity .7s ease";
    splash.style.opacity="0";
    setTimeout(function(){splash.style.display="none";},720);
  }
  splash.addEventListener("click",function(){sndClick();dismissSplash();});

  /* 页1 */
  var btnYes=document.getElementById("btnYes");
  var btnNo=document.getElementById("btnNo");
  var NO_LINES=["让我做小三吗，你舍得吗？","无名无分的才更刺激吗",
    "都要接吻了还不愿意承认关系吗","我们的关系由我来定",
    "我们此生共度厄，也算是纠缠一辈子了","别抵抗了，你要遵从心里想的"];
  var noBusy=false;

  btnYes.addEventListener("click",function(e){
    sndClick();
    var r=btnYes.getBoundingClientRect();
    goTo(1,r.left+r.width/2,r.top+r.height/2);
  });
  btnNo.addEventListener("click",function(){
    if(noBusy)return;
    noBusy=true;
    btnNo.style.opacity=".4";
    btnNo.style.pointerEvents="none";
    sndEnd();
    /* 预警 */
    showWarning();
    /* 愿意键轻轻晃动 */
    setTimeout(function(){
      btnYes.classList.add("sway");
      noBusy=false;
    },1500);
  });
  function showWarning(){
    var w=document.getElementById("warning");
    w.classList.add("show");
    sndBlip(240,0.22,0.10);
    setTimeout(function(){sndBlip(240,0.22,0.10);},300);
    setTimeout(function(){w.classList.remove("show");},1100);
  }
  /* 文案从屏幕正中间飘出，随机方向慢速漂散 */
  function showLinesTogether(cx,cy){
    for(var i=0;i<NO_LINES.length;i++){
      (function(idx){
        var tx=(Math.random()<0.5?-1:1)*(120+Math.random()*260); /* 随机横向偏移 */
        var ty=(Math.random()*220-110);                          /* 随机纵向偏移 */
        var d=6.2+Math.random()*2.0;                             /* 较慢 6.2–8.2s */
        var t=document.createElement("div");
        t.className="floatline";
        t.textContent=NO_LINES[idx];
        t.style.left=cx+"px";
        t.style.top=cy+"px";
        t.style.setProperty("--tx",tx+"px");
        t.style.setProperty("--ty",ty+"px");
        t.style.setProperty("--d",d+"s");
        document.body.appendChild(t);
        sndBlip(520+idx*40,0.1,0.07);
        (function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},(d+1)*1000);})(t);
      })(i);
    }
  }

  /* 页2/3 下滑/点空白前进 */
  var ADVANCE=[1,2];
  var touchY=null;
  document.addEventListener("touchstart",function(e){touchY=e.touches[0].clientY;},{passive:true});
  document.addEventListener("touchend",function(e){
    if(touchY===null)return;
    var dy=touchY-(e.changedTouches[0].clientY);
    touchY=null;
    if(dy>55 && ADVANCE.indexOf(cur)!==-1 && cur<3){
      var c=e.changedTouches[0];
      goTo(cur+1,c.clientX,c.clientY);
    }
  },{passive:true});
  var wheelLock=false;
  document.addEventListener("wheel",function(e){
    if(ADVANCE.indexOf(cur)!==-1 && cur<3 && e.deltaY>40 && !wheelLock){
      wheelLock=true;
      goTo(cur+1,window.innerWidth/2,window.innerHeight/2);
      setTimeout(function(){wheelLock=false;},700);
    }
  },{passive:true});
  document.addEventListener("click",function(e){
    if(ADVANCE.indexOf(cur)!==-1 && cur<3){
      if(e.target.closest("a,button,#musicBtn,#playerBox,.key"))return;
      var rect=pages[cur].getBoundingClientRect();
      var cy=e.clientY-rect.top;
      if(cy>90 && cy<window.innerHeight*0.8){
        goTo(cur+1,e.clientX,e.clientY);
      }
    }
  });

  /* 页4 */
  var p4Text=document.getElementById("p4text");
  var endmark=document.getElementById("endmark");
  var subend=document.querySelector("#page4 .subend");
  var P4="牵着我的手，我们共进退";
  var p4Done=false;
  function runPage4(){
    if(p4Done)return;
    p4Done=true;
    p4Text.textContent="";
    var chars=P4.split("");
    var i=0;
    (function addChar(){
      if(i>=chars.length){
        setTimeout(function(){
          p4Text.classList.add("shake");
          sndEnd();
          setTimeout(function(){
            p4Text.classList.remove("shake");
            p4Text.classList.add("fadeout");
            sndBlip(300,0.3,0.06);
            setTimeout(function(){
              p4Text.style.display="none";
              endmark.classList.add("show");
              subend.classList.add("show");
              sndEnd();
              burstDrops(window.innerWidth/2,window.innerHeight/2,10);
            },1150);
          },560);
        },350);
        return;
      }
      var sp=document.createElement("span");
      sp.textContent=chars[i];
      p4Text.appendChild(sp);
      sndChar();
      (function(el){setTimeout(function(){el.classList.add("in");},10);})(sp);
      i++;
      setTimeout(addChar,260);
    })();
  }

  /* 音乐 */
  var musicBtn=document.getElementById("musicBtn");
  var bgmAudio=document.getElementById("bgmAudio");
  var musicOn=true;
  musicBtn.addEventListener("click",function(e){
    e.stopPropagation();
    sndClick();
    musicOn=!musicOn;
    if(bgmAudio){
      if(musicOn){var p=bgmAudio.play(); if(p&&p.catch)p.catch(function(){});}
      else{bgmAudio.pause();}
    }
    document.getElementById("icoOn").style.display=musicOn?"":"none";
    document.getElementById("icoOff").style.display=musicOn?"none":"";
  });

})();
</script>
</body>
</html>
